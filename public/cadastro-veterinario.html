<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veterinários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
      <div class="card-body p-4 p-md-5">

        <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

        <h1 class="h4 mb-1 text-center">Cadastro de Veterinário</h1>
        <p class="text-muted text-center mb-4">Preencha os dados abaixo para cadastrar um novo profissional</p>

        <form id="cadastro-vet">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" id="nome" placeholder="Digite o nome">
          </div>

          <div class="mb-3">
            <label for="cfmv" class="form-label">CFMV</label>
            <input type="text" class="form-control" name="CFMV" id="cfmv" placeholder="Digite o CFMV">
          </div>

          <div class="mb-4">
            <label for="especialidade" class="form-label">Especialidade</label>
            <input type="text" class="form-control" name="especialidade" id="especialidade" placeholder="Digite a especialidade">
          </div>

          <button type="button" class="btn btn-primary w-100" id="btnsalvar">Salvar</button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/cadastro-vet.js"></script>
</body>
</html>
