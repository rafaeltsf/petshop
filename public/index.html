<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petshop - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header>
    <div class="barra">
      <strong>PetShop</strong>
    </div>
      <nav>
        <ul>
         <li><a href="index.html">Home</a></li>
          <li><a href="cadastro-pet.html">Cadastro Pet</a></li>
          <li><a href="cadastro-vet.html">Cadastro Veterinário</a></li>
        </ul>
      </nav>
  </header>

  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">

            <div class="text-center mb-4">
              <h1 class="h3">🐾 Petshop</h1>
              <p class="text-muted">Entre com sua conta</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                <div class="invalid-feedback">Informe um e-mail válido.</div>
              </div>

              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Sua senha" required minlength="6">
                <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="lembrar">
                <label class="form-check-label" for="lembrar">Lembrar de mim</label>
              </div>

              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <div class="text-center mt-3">
              <small class="text-muted">Não tem conta? <a href="cadastro.html">Cadastre-se</a></small>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
